<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel da Vida</title>
<meta name="description" content="Dinheiro, trabalho PJ e prazos. Tudo fica só neste aparelho.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f5c'/%3E%3Cpath d='M8 21l5-6 4 4 7-9' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/estilo.css">
<script>
  // aplica o tema salvo antes de pintar, para não piscar
  try { var t = localStorage.getItem('painel-da-vida:tema'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="topo">
  <a class="marca" href="#/" aria-label="Painel da Vida, início">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 21l5-6 4 4 7-9"/></svg>
    <span>Painel da Vida</span>
  </a>
  <div class="topo-acoes">
    <button type="button" class="btn btn-fantasma" data-acao="exportar" title="Baixar backup em JSON">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
      <span>Backup</span>
    </button>
    <button type="button" class="btn btn-icone btn-fantasma" data-acao="tema" id="botao-tema" aria-label="Tema: automático">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>
</header>

<nav class="abas" aria-label="Seções">
  <a href="#/" data-rota="painel">Painel</a>
  <a href="#/pj" data-rota="pj">Trabalho PJ</a>
  <a href="#/caixa" data-rota="caixa">Caixa</a>
  <a href="#/ajustes" data-rota="ajustes">Ajustes</a>
</nav>

<main id="conteudo" tabindex="-1">
  <p class="carregando">Carregando…</p>
</main>

<footer class="rodape">
  Seus dados ficam só neste navegador. Para usar em outro aparelho, faça o backup e importe lá.
</footer>

<div id="aviso" class="toast" role="status" aria-live="polite"></div>

<noscript><p class="erro-inicial">O Painel da Vida precisa de JavaScript.</p></noscript>
<script>
  // Módulos JS não carregam em file://: avisa em vez de ficar em branco.
  if (location.protocol === 'file:') {
    setTimeout(function () {
      if (!window.__painelIniciado) {
        document.getElementById('conteudo').innerHTML =
          '<div class="cartao erro-inicial"><h1>Abra pelo endereço do site</h1>' +
          '<p>O navegador não roda este app aberto direto do arquivo. Use o endereço do GitHub Pages ' +
          'ou, na pasta do projeto, rode <code>python -m http.server</code> e abra <code>http://localhost:8000</code>.</p></div>';
      }
    }, 800);
  }
</script>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
